name: Deploy to VPS

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    # Runner instalado directamente en el VPS — sin SSH externo, sin timeouts
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Pull latest changes
        run: |
          cd /var/www/gestoriahol.com
          git fetch origin
          git checkout ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}
          git clean -fd
          echo "✅ Código actualizado desde rama ${{ github.ref_name }}: $(git log --oneline -1)"

      - name: Save rollback tag
        run: |
          docker tag gestoriahol_web:latest gestoriahol_web:rollback 2>/dev/null || true
          echo "📦 Rollback tag guardado"

      - name: Stop old containers
        run: |
          cd /var/www/gestoriahol.com
          docker compose down || true

      - name: Build new image
        run: |
          cd /var/www/gestoriahol.com
          docker compose build --no-cache
          echo "🔨 Build completado"

      - name: Start containers
        run: |
          cd /var/www/gestoriahol.com
          docker compose up -d
          echo "🚀 Contenedor iniciado"

      - name: Health check
        run: |
          echo "⏳ Esperando respuesta del sitio..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001 || echo "000")
            echo "  Intento $i/12: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Sitio operativo y saludable"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Health check fallido — ejecutando rollback..."
          cd /var/www/gestoriahol.com
          docker compose down || true
          docker tag gestoriahol_web:rollback gestoriahol_web:latest 2>/dev/null || true
          docker compose up -d
          echo "⚠️ Rollback completado — versión anterior restaurada"
          exit 1

      - name: Confirm deployment
        run: |
          echo "🌐 Despliegue completado correctamente"
          echo "🔗 https://gestoriahol.com"
          docker compose ps
